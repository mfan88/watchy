# Builds every Watchy app and, when run manually, publishes them as a GitHub release.
#
#   Pull requests: build everything (as version 0.0.0) to check nothing is broken.
#   Actions tab -> "Apps" -> Run workflow (version, e.g. 2.0.0): build and publish
#   release v<version> with all installers attached. Installed apps update themselves
#   from the latest release.
#
# No stream key is built into any app: users sign in at https://tv.zuxi.me/auth/key.
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD   fixed APK signing key (needed so
#                                                         updates install over old versions)
#   TIZEN_AUTHOR_P12_BASE64, TIZEN_AUTHOR_PASSWORD,
#   TIZEN_DISTRIBUTOR_P12_BASE64, TIZEN_DISTRIBUTOR_PASSWORD   Samsung certificates; without
#                                                         them the .wgt is unsigned
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID         Developer ID signing + notarization;
#                                                         without them macOS warns on first open
name: Apps

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.0)"
        required: true
        default: "2.0.0"

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0' }}

jobs:
  android:
    name: Android TV (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: APK is signed with a throwaway debug key, so it won't update over other builds."
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion="$VERSION"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Watchy-$VERSION-androidtv.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  tizen:
    name: Samsung TV (.wgt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: pip install --quiet pillow
      - name: Samsung certificates
        id: certs
        env:
          AUTHOR: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PW: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DIST: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DIST_PW: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          if [ -z "$AUTHOR" ] || [ -z "$DIST" ]; then
            echo "::warning::Tizen certificates not set: the .wgt is unsigned. Sign it with your Samsung profile before installing."
            exit 0
          fi
          echo "$AUTHOR" | base64 -d > "$RUNNER_TEMP/author.p12"
          echo "$DIST" | base64 -d > "$RUNNER_TEMP/distributor.p12"
          curl -fsSL -o "$RUNNER_TEMP/tizen-cli.bin" https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$RUNNER_TEMP/tizen-cli.bin"
          "$RUNNER_TEMP/tizen-cli.bin" --accept-license "$HOME/tizen-studio"
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          "$HOME/tizen-studio/tools/ide/bin/tizen" security-profiles add -n watchy \
            -a "$RUNNER_TEMP/author.p12" -p "$AUTHOR_PW" -d "$RUNNER_TEMP/distributor.p12" -dp "$DIST_PW"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Package
        working-directory: tizen
        env:
          AUTHOR_PW: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DIST_PW: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          if [ "${{ steps.certs.outputs.signed }}" = "true" ]; then
            # The Tizen CLI asks for the certificate passwords on a terminal even though
            # they're in the profile; expect gives it one and answers the prompts.
            sudo apt-get install -y -q expect >/dev/null
            expect -c '
              set timeout 600
              spawn ./package.sh watchy
              expect {
                -nocase -re {author[^\n]*password:} { send -- "$env(AUTHOR_PW)\r"; exp_continue }
                -nocase -re {distributor[^\n]*password:} { send -- "$env(DIST_PW)\r"; exp_continue }
                eof
              }
              catch wait result
              exit [lindex $result 3]
            ' || { echo "::error::Signing failed. Tizen CLI log:"; tail -n 60 "$HOME"/tizen-studio-data/cli/logs/cli.log || true; exit 1; }
            # Certificates are configured, so an unsigned package would be a silent failure.
            unzip -l Watchy.wgt | grep -q author-signature.xml || { echo "::error::Watchy.wgt is not signed"; exit 1; }
          else
            ./package.sh
          fi
          mkdir -p ../dist
          cp Watchy.wgt "../dist/Watchy-$VERSION-samsung-tizen.wgt"
          cp watchy-tizen-ota.json ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tizen
          path: dist/*

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build, sign and notarize
        working-directory: mac
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter test
          ./build_dmg.sh "$VERSION"
          mkdir -p ../dist && cp dist/*.dmg ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    name: Windows (installer + zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Artwork
        # mac/assets/public is a symlink to public/, which Windows checkouts turn into a text file.
        run: |
          Remove-Item -Force mac/assets/public
          Copy-Item -Recurse public mac/assets/public
      - name: Build
        working-directory: mac
        run: |
          flutter build windows --release --build-name="$env:VERSION" --dart-define=APP_VERSION="$env:VERSION"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/Watchy-$env:VERSION-windows-x64-portable.zip"
      - name: Installer
        working-directory: mac
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" packaging/installer.iss
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item dist/* ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (AppImage + tar.gz)
    # Built on the oldest supported Ubuntu so the AppImage runs on newer distros too
    # (Ubuntu 22.04+, Debian 12+, Fedora, Arch, ...).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libfuse2 file
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: mac
        run: |
          flutter test
          flutter build linux --release --build-name="$VERSION" --dart-define=APP_VERSION="$VERSION"
          packaging/build_appimage.sh "$VERSION"
          mkdir -p ../dist && cp dist/* ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    needs: [android, tizen, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          {
            echo "Watchy $VERSION for Android TV / Google TV, Samsung TVs, macOS, Windows and Linux."
            echo
            echo "**New here?** See [how to install and use Watchy](https://github.com/${{ github.repository }}/blob/v$VERSION/APPS.md)."
            echo "Already installed? The apps update themselves."
            echo
            echo "| Device | Download |"
            echo "|---|---|"
            echo "| Android TV / Google TV | \`Watchy-$VERSION-androidtv.apk\` |"
            echo "| Samsung TV (Tizen 2.4+) | \`Watchy-$VERSION-samsung-tizen.wgt\` |"
            echo "| Mac | \`Watchy-$VERSION-macos.dmg\` |"
            echo "| Windows | \`Watchy-$VERSION-windows-x64-setup.exe\` (or the portable .zip) |"
            echo "| Linux | \`Watchy-$VERSION-linux-x86_64.AppImage\` (or the .tar.gz) |"
          } > notes.md
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Watchy $VERSION" --notes-file notes.md
