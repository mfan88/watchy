name: watchy_mac
description: Watchy for macOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  video_player: ^2.9.2
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/public/teams/
    - assets/public/providers/
    - assets/public/matchups/
  fonts:
    - family: Anxler
      fonts:
        - asset: assets/fonts/anxler.ttf
